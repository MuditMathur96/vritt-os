version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: backend
    restart: always
    environment:
      - NODE_ENV=production
    ports:
      - "9000:9000"

  frontend:
    build:
      context: .
      dockerfile: apps/client-app/Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend